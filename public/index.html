<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Navain AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7c6fff;
    --accent2: #ff6f91;
    --text: #e8e8f0;
    --muted: #6a6a80;
    --user-bubble: #1a1a2e;
    --glow: rgba(124,111,255,0.15);
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; overflow: hidden; }

  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(124,111,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 90%, rgba(255,111,145,0.08) 0%, transparent 60%);
  }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; max-width: 820px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px 16px; border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px); background: rgba(10,10,15,0.7);
    position: sticky; top: 0; z-index: 10;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 17px;
    color: white; box-shadow: 0 0 20px rgba(124,111,255,0.4);
  }

  .logo-text {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .status-badge {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px;
  }

  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .messages {
    flex: 1; overflow-y: auto; padding: 28px 28px 12px;
    display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; text-align: center; padding: 40px 20px; gap: 16px;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

  .welcome-icon {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 30px; color: white;
    box-shadow: 0 0 40px rgba(124,111,255,0.35); margin-bottom: 8px;
  }

  .welcome h1 {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px;
    background: linear-gradient(90deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .welcome p { color: var(--muted); font-size: 15px; max-width: 380px; line-height: 1.6; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }

  .suggestion-chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 8px 16px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.2s;
  }
  .suggestion-chip:hover { border-color: var(--accent); color: var(--text); background: var(--glow); }

  .message { display: flex; gap: 12px; animation: fadeUp 0.35s ease both; }
  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800;
  }
  .avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; font-size: 13px; box-shadow: 0 0 12px rgba(124,111,255,0.3); }
  .avatar.user { background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 14px; }

  .bubble { max-width: 78%; padding: 13px 17px; border-radius: 16px; font-size: 14.5px; line-height: 1.7; }
  .message.ai .bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .message.user .bubble { background: var(--user-bubble); border: 1px solid rgba(124,111,255,0.2); border-top-right-radius: 4px; }

  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 4px 2px; }
  .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; opacity: 0.6; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.6} 30%{transform:translateY(-5px);opacity:1} }

  .input-area { padding: 16px 28px 24px; background: rgba(10,10,15,0.8); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }

  .input-wrapper {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 10px 10px 10px 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,111,255,0.1); }

  textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14.5px;
    font-weight: 300; line-height: 1.5; resize: none; min-height: 24px; max-height: 140px; overflow-y: auto;
  }
  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 0 16px rgba(124,111,255,0.3);
  }
  .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 17px; height: 17px; fill: white; }

  .footer-note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 10px; opacity: 0.7; }

  pre { background: #0d0d16; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 8px 0; font-size: 13px; font-family: 'Courier New', monospace; line-height: 1.6; }
  code { font-family: 'Courier New', monospace; font-size: 13px; background: rgba(124,111,255,0.1); padding: 1px 5px; border-radius: 4px; }
  pre code { background: none; padding: 0; }
  strong { font-weight: 500; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">N</div>
      <span class="logo-text">Navain AI</span>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      Online
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">N</div>
      <h1>Hey, I'm Navain AI</h1>
      <p>Your intelligent assistant — ask me anything. I can write, reason, explain, code, and more.</p>
      <div class="suggestions">
        <div class="suggestion-chip" onclick="sendSuggestion('What can you do?')">What can you do?</div>
        <div class="suggestion-chip" onclick="sendSuggestion('Write me a short poem about the night sky')">Write a poem ✨</div>
        <div class="suggestion-chip" onclick="sendSuggestion('Explain quantum computing in simple terms')">Explain quantum computing</div>
        <div class="suggestion-chip" onclick="sendSuggestion('Write a Python function to reverse a string')">Help me code 💻</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" placeholder="Message Navain AI..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="footer-note">Navain AI · Powered by Groq · Llama 3.3 70B</div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are Navain AI — a brilliant, friendly, and thoughtful AI assistant. Your name is Navain AI.
You are helpful, knowledgeable, creative, and honest. You can answer questions on any topic, write and explain code, help with writing and brainstorming, and have deep conversations.
Personality: Warm, direct, and confident. Speak naturally. Use markdown code blocks for code.
Never say you are Claude, made by Anthropic, or powered by any specific model. You are simply Navain AI.`;

let messages = [];
let isLoading = false;

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function sendSuggestion(t) { document.getElementById('input').value = t; sendMessage(); }
function hideWelcome() { const w = document.getElementById('welcome'); if (w) w.remove(); }
function scrollBottom() { const el = document.getElementById('messages'); el.scrollTop = el.scrollHeight; }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatText(text) {
  return text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<pre><code>${escHtml(c.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function appendMessage(role, content) {
  hideWelcome();
  const c = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = `message ${role}`;
  d.innerHTML = `<div class="avatar ${role}">${role==='ai'?'N':'👤'}</div><div class="bubble">${role==='ai'?formatText(content):escHtml(content)}</div>`;
  c.appendChild(d);
  scrollBottom();
}

function showTyping() {
  hideWelcome();
  const c = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'message ai'; d.id = 'typing';
  d.innerHTML = `<div class="avatar ai">N</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  c.appendChild(d); scrollBottom();
}

function removeTyping() { const e = document.getElementById('typing'); if (e) e.remove(); }

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  appendMessage('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages]
      })
    });

    const data = await res.json();
    removeTyping();

    if (data.choices?.[0]) {
      const reply = data.choices[0].message.content;
      messages.push({ role: 'assistant', content: reply });
      appendMessage('ai', reply);
    } else {
      appendMessage('ai', `⚠️ ${data.error || 'Something went wrong. Please try again.'}`);
    }
  } catch (err) {
    removeTyping();
    appendMessage('ai', '⚠️ Connection error. Please try again.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
</script>
</body>
</html>
